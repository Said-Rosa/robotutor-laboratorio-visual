name: Validate proposed RoboTutor changes
on:
  pull_request:
    paths:
      - robotutor.html
      - build-artifact.sh
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/pr-checks.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:plates && git diff --exit-code -- robotutor.html
      - run: node scripts/check-source.cjs
      - run: node scripts/check-worked-solutions.cjs
      - run: node scripts/check-mechanical-plates.cjs
      - run: node scripts/check-kinematics.cjs
      - run: node scripts/check-selftests.cjs
      - run: node scripts/check-exercises.cjs
      - run: node scripts/check-security.cjs
      - run: bash build-artifact.sh robotutor.html /tmp/robotutor-pages.html
      - run: bash build-artifact.sh robotutor.html /tmp/robotutor-artifact.html artifact
      - run: node scripts/check-source.cjs /tmp/robotutor-pages.html
      - run: node scripts/check-source.cjs /tmp/robotutor-artifact.html --artifact
      - run: node scripts/check-security.cjs /tmp/robotutor-pages.html
      - run: node scripts/check-security.cjs /tmp/robotutor-artifact.html --artifact
